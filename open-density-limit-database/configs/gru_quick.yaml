run_name: gru_quick_seed42
model: gru
random_state: 42

data:
  window_size: 50
  forecast_horizon: 20
  window_stride: 10
  test_size: 0.20
  val_size: 0.10

training:
  epochs: 5
  batch_size: 32
  patience: 2
  learning_rate: 0.001
  classification_threshold: 0.5
  minimum_recall: 0.95

model_parameters:
  units: [64, 32]
  sequence_dropout: 0.20
  summary_dropout: 0.30
  dense_units: 32

evaluation:
  run_test: false
